# ============================================================
# CloudPulse — GitHub Actions CI/CD Pipeline
# ============================================================
# This pipeline automatically builds, pushes, and deploys
# CloudPulse whenever you push code to the main branch.
#
# Pipeline Flow:
# 1. Code pushed to GitHub → Triggers workflow
# 2. Build Docker images for frontend & backend
# 3. Push images to Docker Hub
# 4. SSH into EC2 and deploy to Kubernetes
# ============================================================

name: CloudPulse CI/CD Pipeline

# When to run this pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Environment variables used across all jobs
env:
  DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  IMAGE_TAG: ${{ github.sha }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ==========================================================
  # Job 1: Build and Test
  # ==========================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      # ----- Backend -----
      - name: Install backend dependencies
        run: cd backend && npm install

      # ----- Frontend -----
      - name: Install frontend dependencies
        run: cd frontend && npm install

      - name: Build frontend
        run: cd frontend && npm run build
        env:
          REACT_APP_API_URL: ""

  # ==========================================================
  # Job 2: Build and Push Docker Images
  # ==========================================================
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.DOCKER_USERNAME != '' &&
      secrets.DOCKER_PASSWORD != ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ----- Build & Push Backend -----
      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cloudpulse-backend:${{ env.IMAGE_TAG }} \
                       -t ${{ secrets.DOCKER_USERNAME }}/cloudpulse-backend:latest \
                       ./backend

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudpulse-backend:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudpulse-backend:latest

      # ----- Build & Push Frontend -----
      - name: Build frontend image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/cloudpulse-frontend:${{ env.IMAGE_TAG }} \
                       -t ${{ secrets.DOCKER_USERNAME }}/cloudpulse-frontend:latest \
                       ./frontend

      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudpulse-frontend:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKER_USERNAME }}/cloudpulse-frontend:latest

  # ==========================================================
  # Job 3: Deploy to EC2 Kubernetes Cluster
  # ==========================================================
  deploy:
    name: Deploy to K8s
    runs-on: ubuntu-latest
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull latest code
            cd ~/CloudPulse || git clone https://github.com/${{ github.repository }}.git ~/CloudPulse && cd ~/CloudPulse
            git pull origin main

            # Update image tags in deployment files
            export DOCKER_USER=${{ secrets.DOCKER_USERNAME }}
            export IMAGE_TAG=${{ env.IMAGE_TAG }}

            # Replace placeholder with actual Docker Hub username
            sed -i "s|YOUR_DOCKERHUB_USERNAME|${DOCKER_USER}|g" k8s/backend/deployment.yaml
            sed -i "s|YOUR_DOCKERHUB_USERNAME|${DOCKER_USER}|g" k8s/frontend/deployment.yaml

            # Apply all Kubernetes manifests
            kubectl apply -f k8s/namespace.yaml
            kubectl apply -f k8s/backend/
            kubectl apply -f k8s/frontend/
            kubectl apply -f k8s/monitoring/
            kubectl apply -f k8s/ingress/

            # Restart deployments to pull new images
            kubectl rollout restart deployment/cloudpulse-backend -n cloudpulse
            kubectl rollout restart deployment/cloudpulse-frontend -n cloudpulse

            # Wait for rollout to complete
            kubectl rollout status deployment/cloudpulse-backend -n cloudpulse --timeout=120s
            kubectl rollout status deployment/cloudpulse-frontend -n cloudpulse --timeout=120s

            echo "✅ Deployment completed successfully!"
