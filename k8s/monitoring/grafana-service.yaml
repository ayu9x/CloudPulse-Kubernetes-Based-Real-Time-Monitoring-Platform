# ============================================================
# Grafana — Service (NodePort)
# ============================================================
# Access: http://EC2_PUBLIC_IP:30030
# Login: admin / cloudpulse123
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: cloudpulse
  labels:
    app: cloudpulse
    component: grafana
spec:
  type: NodePort
  selector:
    app: cloudpulse
    component: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30030
