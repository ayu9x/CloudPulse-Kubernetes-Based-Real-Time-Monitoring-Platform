# ============================================================
# Prometheus — Service (NodePort)
# ============================================================
# NodePort exposes Prometheus on port 30090 on the EC2 instance.
# Access: http://EC2_PUBLIC_IP:30090
# ============================================================

apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: cloudpulse
  labels:
    app: cloudpulse
    component: prometheus
spec:
  type: NodePort
  selector:
    app: cloudpulse
    component: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
      nodePort: 30090
