# ============================================================
# Grafana — Datasource ConfigMap (Auto-provisioning)
# ============================================================
# This ConfigMap tells Grafana to automatically add Prometheus
# as a datasource when it starts up. No manual configuration needed!
# ============================================================

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasource
  namespace: cloudpulse
  labels:
    app: cloudpulse
    component: grafana
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.cloudpulse.svc:9090
        isDefault: true
        editable: true
