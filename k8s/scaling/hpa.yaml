# ============================================================
# CloudPulse — Horizontal Pod Autoscaler (HPA)
# ============================================================
# HPA automatically scales the number of pods based on CPU usage.
# When CPU > 70%, it creates more pods (up to maxReplicas).
# When CPU drops, it removes pods (down to minReplicas).
#
# This is what "auto-scaling" means in production!
# ============================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: cloudpulse
  labels:
    app: cloudpulse
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cloudpulse-backend
  
  minReplicas: 1     # Minimum pods (saves resources on Free Tier)
  maxReplicas: 4     # Maximum pods during high load
  
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # Scale up when CPU > 70%
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30   # Wait 30s before scaling up
      policies:
        - type: Pods
          value: 1                      # Add 1 pod at a time
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 120  # Wait 2 min before scaling down
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
